<title>리르가드의 미궁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: 고딕 지하묘지 — 촛불 아래 돌벽, 양피지빛 선과 핏빛 강조. 왼쪽 시야+기록, 오른쪽 파티+명령 */
:root{
  --bg:#0b090a; --win:#151012; --win2:#221a1c; --line:#d9caa9; --dim:#8f7f6c;
  --blood:#a3241d; --bad:#e0573f; --gold:#d9a647; --hp:#86ad6c; --mag:#a08ddb; --poison:#9cc25a;
  --f-black:'UnifrakturMaguntia','Old English Text MT',serif;
  --f-display:'Song Myung','Nanum Myeongjo','Batang',serif;
  --f-body:'Gowun Batang','Nanum Myeongjo','Batang',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(120% 70% at 50% 0%,#24181a 0%,var(--bg) 62%) var(--bg);color:var(--line);font:15px/1.65 var(--f-body);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 28px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:1px solid #3a2e2a;padding-bottom:12px}
.brand{display:grid;gap:2px}
.brand .bl{font:400 clamp(20px,3.2vw,28px)/1 var(--f-black);color:var(--blood);letter-spacing:.02em}
h1{font:400 clamp(26px,4.2vw,40px)/1.1 var(--f-display);margin:0;letter-spacing:.06em;text-wrap:balance}
.hud{display:flex;flex-wrap:wrap;gap:4px 18px;font-variant-numeric:tabular-nums;color:var(--dim)}
.hud b{color:var(--line);font-weight:700}.hud .g{color:var(--gold)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-areas:"view party" "log cmd";gap:26px 20px;align-items:stretch}
#viewbox{grid-area:view;display:flex;flex-direction:column}
#partybox{grid-area:party}
#logbox{grid-area:log;display:flex;flex-direction:column}
#cmdbox{grid-area:cmd}
/* 창틀: 가는 이중선 + 모서리 마름모 */
.win{position:relative;background:linear-gradient(180deg,var(--win2),var(--win) 40%);border:1px solid var(--line);
  outline:1px solid rgba(217,202,169,.28);outline-offset:4px;padding:18px 14px 14px;min-width:0;margin:5px}
.win::before,.win::after{content:"";position:absolute;top:-9px;width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.win::before{left:-9px}.win::after{right:-9px}
.cap{position:absolute;top:-.95em;left:20px;background:var(--bg);padding:0 10px;font:15px var(--f-display);letter-spacing:.32em;color:var(--gold)}
canvas{display:block;width:100%;height:auto;max-width:100%;background:#050304}
#view{aspect-ratio:480/300;cursor:pointer}
.place{min-height:210px;display:grid;gap:12px;align-content:start}
.place .hero{display:flex;gap:16px;align-items:center}
.place .hero svg{width:72px;height:72px;flex:none;fill:var(--line);filter:drop-shadow(0 0 10px rgba(163,36,29,.55))}
.place h2{font:400 26px/1.2 var(--f-display);margin:0;color:var(--gold);text-wrap:balance}
.place p{margin:0;max-width:60ch}
.muted{color:var(--dim)}
.loc{margin-top:auto;padding-top:10px;color:var(--dim);font-size:13px;line-height:1.55;height:calc(3.1em + 10px);overflow:hidden}
/* 데스크톱: 윗줄은 시야 높이, 아랫줄은 300px로 고정. 파티·기록·명령은 그 안에서 스크롤한다 */
@media (min-width:841px){
  .grid{grid-template-rows:auto 300px}
  #partybox,#logbox,#cmdbox{position:relative;min-height:0}
  #partybox .fill,#cmdbox .fill,#logbox #log{position:absolute;inset:20px 10px 12px 14px;overflow-y:auto;overflow-x:hidden;padding-right:4px;min-height:0}
}
#recent{display:none;margin-top:8px;font-size:13px;line-height:1.5;border-top:1px dashed #3a2e2a;padding-top:8px}
#log{flex:1 1 0;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-size:14px}
.l{white-space:pre-wrap}
.l.sys{color:var(--dim)}.l.bad{color:var(--bad)}.l.good{color:var(--hp)}.l.gold{color:var(--gold)}.l.mag{color:var(--mag)}
.l.round{color:var(--dim);text-align:center;letter-spacing:.3em;font-size:12px}
.party{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.pm{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px;border:1px solid transparent}
.pm.cur{border-color:var(--gold);background:rgba(217,166,71,.06)}
.pm.dead{opacity:.55}
.pt{grid-row:1/3;width:44px;height:44px;border:1px solid #4a3c35;background:radial-gradient(circle at 50% 35%,#2c2023,#0d0a0b);padding:4px;fill:var(--line)}
.pt.spr-box{display:grid;place-items:center;padding:0;overflow:hidden}
.spr{display:block;background-repeat:no-repeat;background-size:calc(var(--f)*100%) 100%;animation:spr var(--dur) steps(var(--f),jump-none) infinite}
@keyframes spr{from{background-position:0 0}to{background-position:100% 0}}
.pm.dead .pt{fill:var(--dim)}
.pm .nm{font-weight:700;min-width:0}
.pm .nm span{font-weight:400;color:var(--dim);font-size:13px}
.pm .row{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:10px;font-size:12px;color:var(--dim)}
.bar{height:5px;background:#050304;border:1px solid #4a3c35;margin-top:3px}
.bar i{display:block;height:100%;background:var(--hp)}
.bar.mp i{background:var(--mag)}.bar.low i{background:var(--bad)}
.pm .tag{font-size:12px;color:var(--dim);text-align:right}
.bfs{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.bf{font-size:11px;line-height:1.5;padding:0 5px;border:1px solid currentColor}
.bf.good{color:var(--gold)}.bf.bad{color:var(--mag)}.bf.poison{color:var(--poison)}
.ftxt{position:absolute;right:10px;top:2px;font:700 18px var(--f-body);pointer-events:none;animation:ftxt .9s ease-out both}
.ftxt.hit{color:var(--bad)}.ftxt.heal{color:var(--hp)}.ftxt.buff{color:var(--gold)}.ftxt.debuff{color:var(--mag)}
@keyframes ftxt{from{opacity:1;transform:translateY(8px)}to{opacity:0;transform:translateY(-20px)}}
.pm.fx-hit{animation:pmHit .5s ease-out both}
.pm.fx-heal{animation:pmGlow .8s ease-out both;--glow:rgba(134,173,108,.35)}
.pm.fx-buff{animation:pmGlow .8s ease-out both;--glow:rgba(217,166,71,.3)}
.pm.fx-debuff{animation:pmGlow .8s ease-out both;--glow:rgba(160,141,219,.35)}
@keyframes pmHit{0%{background:rgba(224,87,63,.4);transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{background:transparent;transform:none}}
@keyframes pmGlow{0%{background:var(--glow);box-shadow:0 0 18px var(--glow)}100%{background:transparent;box-shadow:none}}
.rowlbl{font:12px var(--f-display);color:var(--dim);letter-spacing:.3em;margin-top:2px}
.qlist{display:grid;gap:3px;margin-top:8px;padding-top:8px;border-top:1px dashed #3a2e2a;font-size:13px}
.qlist .q{display:flex;justify-content:space-between;gap:10px}
.qlist .q b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
.qlist .q.ok b{color:var(--gold)}
#cmd{display:grid;gap:10px;align-content:start}
.prompt{margin:0;color:var(--gold)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{font:15px var(--f-body);color:var(--line);background:rgba(5,3,4,.35);border:1px solid var(--line);
  padding:8px 12px;min-height:44px;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:8px}
.pad .btn{justify-content:center;text-align:center}
.btn:hover:not(:disabled){background:var(--blood);border-color:var(--bad)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{border-color:var(--gold);color:var(--gold)}
.btn kbd{font:11px var(--f-body);color:var(--dim);border:1px solid currentColor;padding:0 4px;line-height:1.4}
.btn.wide{width:100%}
.btn .sub{color:var(--dim);font-size:12px;margin-left:auto}
.btn:hover:not(:disabled) .sub,.btn:hover:not(:disabled) kbd{color:var(--line)}
.shop,.quests{display:grid;gap:10px}
.item{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px dashed #3a2e2a}
.item .t{display:flex;justify-content:space-between;gap:10px}
.item .t b{color:var(--gold);font-weight:400;white-space:nowrap}
.item p{margin:0;font-size:13px;color:var(--dim)}
.slot{display:grid;gap:2px}
.slot small{color:var(--dim);font-size:12px}
.store{font-size:12px;color:var(--dim);margin:0}
.keys{margin:0;font-size:12px;color:var(--dim);line-height:1.7}
.end{display:grid;gap:12px;justify-items:start;padding:6px 0}
.end h2{font:400 34px/1.2 var(--f-display);margin:0}
footer{font-size:12px;color:var(--dim);text-align:center;line-height:1.8}
footer a{color:var(--dim)}
/* 시설 창 (모달) */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mback{position:absolute;inset:0;background:rgba(5,3,4,.74);backdrop-filter:blur(3px)}
.mwin{position:relative;width:min(660px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;margin:0;padding:0}
.mwin.enter{animation:mIn .28s ease-out}
.mwin:focus{outline:none}
@keyframes mIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:14px;padding:18px 18px 14px;border-bottom:1px solid #3a2e2a}
.mhead>svg{width:52px;height:52px;fill:var(--line);filter:drop-shadow(0 0 8px rgba(163,36,29,.6));flex:none}
.mhead h2{font:400 26px/1.2 var(--f-display);color:var(--gold);margin:0}
.mhead p{margin:2px 0 0;font-size:14px;color:var(--dim)}
.mgold{margin-left:auto;text-align:right;font-size:12px;color:var(--dim);white-space:nowrap;line-height:1.3}
.mgold b{color:var(--gold);font-size:18px}
.mbody{overflow-y:auto;padding:6px 18px 18px;display:grid;gap:0;font-size:15px}
.msec{font:15px var(--f-display);letter-spacing:.25em;color:var(--gold);margin:16px 0 2px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.msec .store{letter-spacing:0;font-family:var(--f-body)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:12px 0;border-bottom:1px dashed #3a2e2a}
.mrow .nm{font-weight:700;font-size:16px}
.mrow .pr{color:var(--gold);text-align:right;max-width:16em}
.mrow .ds{grid-column:1/3;font-size:14px;color:var(--dim)}
.mrow .btns{grid-column:1/3;margin-top:6px}
.mbody>.btns{margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #3a2e2a;margin-top:8px}
.tab{font:16px var(--f-display);letter-spacing:.2em;color:var(--dim);background:none;border:0;border-bottom:2px solid transparent;padding:8px 18px;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 등록소 */
.cf{display:grid;gap:16px}
.fld{display:grid;gap:8px}
.lbl{font:13px var(--f-display);letter-spacing:.24em;color:var(--dim)}
.lbl.sp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;letter-spacing:.1em}
.lbl.sp b{color:var(--line);font:700 15px var(--f-body)}.lbl.sp b.g{color:var(--gold)}
.lbl.sp .chip{margin-left:auto}
.nmrow{display:flex;gap:8px}
#cname{flex:1;min-width:0;font:16px var(--f-body);color:var(--line);background:#050304;border:1px solid var(--line);padding:8px 10px}
#cname:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:14px var(--f-body);color:var(--line);background:transparent;border:1px solid var(--dim);padding:6px 12px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:20px;height:20px;fill:currentColor}
.chip small{font-size:11px;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--blood);border-color:var(--bad)}
.chip[aria-pressed="true"] small{color:var(--line)}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip:focus-visible,.mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip:disabled{opacity:.35;cursor:default}
.hint{margin:0;font-size:13px;color:var(--dim)}
.stats{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.st{display:grid;grid-template-columns:4.2em 2em auto minmax(0,1fr) 2em;gap:10px;align-items:center}
.st b{text-align:right}
.st .md{font-size:12px;color:var(--gold)}
.adj{display:inline-flex;gap:4px}
.mini{width:32px;height:32px;font:15px var(--f-body);color:var(--line);background:transparent;border:1px solid var(--dim);cursor:pointer;padding:0}
.mini:hover:not(:disabled){background:var(--blood)}
.mini:disabled{opacity:.3;cursor:default}
.sbar{display:flex;height:7px;background:#050304;border:1px solid #4a3c35}
.sbar i{display:block;height:100%;background:var(--dim)}
.sbar i.add{background:var(--gold)}
.stline{font-size:12px;color:var(--dim)}
.btn,.chip,.mini,#view{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:840px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "cmd" "party" "log"}
  #recent{display:block}
  #log{flex:none;height:160px;min-height:0}
  .mhead{flex-wrap:wrap}
  header{padding-bottom:8px}
  .hud{font-size:13px}
}
@media (pointer:coarse){.btn kbd{display:none}.pad .btn{padding:8px 4px;min-height:52px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.spr,.pm,.ftxt{animation:none!important}}
</style>

  <header>
    <div class="brand"><span class="bl">The Catacombs of Lirgard</span><h1>리르가드의 미궁</h1></div>
    <div class="hud" id="hud"></div>
  </header>
  <div class="grid">
    <section class="win" id="viewbox"><span class="cap" id="viewcap">시야</span>
      <canvas id="view" width="480" height="300" aria-label="1인칭 화면"></canvas>
      <div class="place" id="place" hidden></div>
      <div class="loc" id="loc"></div>
      <div id="recent" aria-hidden="true"></div>
    </section>
    <section class="win" id="partybox"><span class="cap">파티</span><div class="fill"><div class="party" id="party"></div><div id="qtrack"></div></div></section>
    <section class="win" id="logbox"><span class="cap">기록</span><div id="log" aria-live="polite"></div></section>
    <section class="win" id="cmdbox"><span class="cap">명령</span><div class="fill" id="cmd"></div></section>
  </div>
  <div id="modal" hidden></div>
  <footer>도트 그림: 0x72 「DungeonTileset II」 (CC0) · 아이콘: <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> — Lorc, Delapouite, Skoll, DarkZaitzev (CC BY 3.0)</footer>
</div>

const SPR = {};   // 'monsters/goblin' → {img, ok, frames, fps, pixel, fw, fh}
function loadSprites(man){
  for(const group of ['party','monsters','props']) for(const [k,d] of Object.entries(man[group]||{})){
    if(!d || !d.src) continue;
    const s = {frames:1, fps:6, pixel:true, ...d, ok:false, img:new Image()};
    s.img.onload = () => { s.ok=true; s.fw=s.img.naturalWidth/s.frames; s.fh=s.img.naturalHeight; if(S) render(); };
    s.img.src = 'assets/'+d.src;
    SPR[group+'/'+k] = s;
  }
}
fetch('assets/manifest.json').then(r=>r.ok?r.json():null).catch(()=>null)
  .then(m=>loadSprites(m && typeof m==='object' ? m : DEFAULT_MANIFEST));

const Store = {
  kind:'local', db:null, uid:null,
  async init(){
    try{
      if(!window.claude?.use) return;
      const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user) return;
      const id = await user.id(); if(!id) return;
      this.db=db; this.uid=id; this.kind='cloud';
    }catch(e){}
  },
  ref(n){ return this.db.collection('data/users/'+this.uid).doc('save'+n); },
  async get(n){
    if(this.kind==='cloud'){ try{ const s=await this.ref(n).get(); return s.exists ? s.data() : null; }catch(e){ return null; } }
    try{ return JSON.parse(localStorage.getItem('lirgard-slot'+n)); }catch(e){ return null; }
  },
  async put(n,rec){
    if(this.kind==='cloud'){ await this.ref(n).set(rec); return; }
    localStorage.setItem('lirgard-slot'+n, JSON.stringify(rec));
  },
  label(){ return this.kind==='cloud' ? '계정에 저장 · 웹과 모바일 어디서나 이어할 수 있다' : '이 브라우저에만 저장된다'; },
};
async function refreshSlots(){
  const out=[]; for(let n=1;n<=SLOTS;n++) out.push(await Store.get(n));
  UI.slots=out; render();
}
function slotLine(rec){
  if(!rec) return '<small>빈 기록</small>';
  const d=new Date(rec.savedAt), t=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `<small>${rec.summary} · ${t}</small>`;
}
async function saveTo(n){
  if(UI.saving) return;
  if(UI.slots?.[n-1] && UI.confirm!==n){ UI.confirm=n; return render(); }
  UI.saving=true; UI.confirm=null; render();
  const snap = JSON.parse(JSON.stringify(S)); snap.combat=null; snap.mode='town'; snap.townView='main'; snap.log=snap.log.slice(-20);
  const rec = {v:4, savedAt:Date.now(), summary:`${S.party.map(m=>`${m.name} Lv${m.lv}`).join(', ')} · ${S.gold}G`, state:JSON.stringify(snap)};
  try{ await Store.put(n,rec); log(`모험 기록부 ${n}번에 기록했다.`,'good'); }
  catch(e){ log(e?.code==='quota_exceeded'?'기록부 저장 공간이 가득 찼다.':'기록하지 못했다. 잠시 후 다시 시도하자.','bad'); }
  UI.saving=false; render(); refreshSlots();
}
async function loadFrom(n){
  const rec = UI.slots?.[n-1] || await Store.get(n);

  normalize();
  S.mode='town'; S.townView='main'; S.combat=null; busy=false; UI.confirm=null; UI.scene='square'; UI.fadeIn=now();
  log(`모험 기록부 ${n}번을 펼쳤다. 파티가 여관에서 눈을 뜬다.`,'gold'); render();
}

function mk(name, cls, race, st){
  const c=CLS[cls], m={name,cls,race,st:{...st},lv:1,xp:0,

    atkB:0,defB:0,magB:0,ag:st.agi+rnd(0,4),dead:false,gear:[],guard:false,bf:[]};
  m.hp=m.mhp; m.mp=m.mmp; return m;
}
function meetsReq(cls, st){ return Object.entries(CLS[cls].req).every(([k,v])=>st[k]>=v); }
function autoChar(name, race, cls){
  const st={...RACES[race].st}; let pts=rnd(6,9);
  for(const [k,v] of Object.entries(CLS[cls].req)) while(st[k]<v+2 && pts>0){ st[k]++; pts--; }
  while(pts>0){ const k=pick(STATS)[0]; if(st[k]<STAT_MAX){ st[k]++; pts--; } }
  return mk(name, cls, race, st);
}

  S.party=[autoChar('가렛','드워프','전사'),autoChar('리아','호빗','도적'),autoChar('세라','엘프','승려'),autoChar('오린','엘프','마법사')];

function beginAdventure(){

const rebirthBonus = () => Math.min(5, S.rebirths||0);
function rollBonus(){ let b=rnd(5,9); if(Math.random()<0.1) b+=10; return b + rebirthBonus(); }
function newDraft(){
  const used=S.party.map(m=>m.name), free=NAMES.filter(n=>!used.includes(n));
  S.draft={name:pick(free), race:'인간', add:{str:0,iq:0,pie:0,vit:0,agi:0,luk:0}, bonus:rollBonus(), cls:null};
}
const dStat = k => RACES[S.draft.race].st[k] + S.draft.add[k];
const dStats = () => Object.fromEntries(STATS.map(([k])=>[k,dStat(k)]));
const dLeft = () => S.draft.bonus - Object.values(S.draft.add).reduce((a,b)=>a+b,0);
function draftProblem(){
  const d=S.draft, nm=d.name.trim();
  if(S.party.length>=4) return '파티가 가득 찼다';
  if(!nm) return '이름을 적어야 한다';
  if(S.party.some(m=>m.name===nm)) return '같은 이름이 이미 있다';
  if(!d.cls) return '직업을 골라야 한다';
  if(dLeft()>0) return `보너스 ${dLeft()}점이 남았다`;
  return '';
}
function createAct(a,v){
  const d=S.draft;
  if(a==='race'){ d.race=v; d.add={str:0,iq:0,pie:0,vit:0,agi:0,luk:0}; if(d.cls&&!meetsReq(d.cls,dStats())) d.cls=null; }
  if(a==='st+' && dLeft()>0 && dStat(v)<STAT_MAX) d.add[v]++;
  if(a==='st-' && d.add[v]>0){ d.add[v]--; if(d.cls&&!meetsReq(d.cls,dStats())) d.cls=null; }
  if(a==='reroll'){ d.add={str:0,iq:0,pie:0,vit:0,agi:0,luk:0}; d.bonus=rollBonus(); d.cls=null;
    log(d.bonus>=15?`서기가 눈을 크게 뜬다. "보너스 ${d.bonus}점! 드문 재능이군."`:`보너스 포인트를 다시 굴렸다: ${d.bonus}점`, d.bonus>=15?'gold':'sys'); }
  if(a==='randname'){ const used=S.party.map(m=>m.name); d.name=pick(NAMES.filter(n=>!used.includes(n)&&n!==d.name)); }
  if(a==='cls' && meetsReq(v,dStats())) d.cls=v;
  if(a==='register' && !draftProblem()){
    const m=mk(d.name.trim(),d.cls,d.race,dStats()); S.party.push(m);
    log(`${m.name} — ${m.race} ${m.cls}. 등록부에 이름이 올랐다. (HP ${m.mhp})`,'good');
    newDraft();
  }
  if(a==='kick'){ const m=S.party.splice(+v,1)[0]; log(`${J(m.name,'이','가')} 등록부에서 지워졌다.`,'sys'); }
  if(a==='up' && +v>0){ const i=+v; [S.party[i-1],S.party[i]]=[S.party[i],S.party[i-1]]; }
  if(a==='begin' && S.party.length) return beginAdventure();
  if(a==='quick') return quickParty();
  render();
}

// ───────── 의뢰 ─────────
const qdef = id => QUESTS.find(q=>q.id===id);
function qCounter(q){
  if(q.kind==='kill') return S.kills[q.tgt]||0;
  if(q.kind==='chest') return S.chests;
  if(q.kind==='floor') return S.maxFloor;
  if(q.kind==='unkfloor') return S.unkMax;
  if(q.kind==='unkboss') return S.unkCleared?1:0;
  return S.bossDead?1:0;
}
function qProgress(q){
  const base = ['floor','boss','unkfloor','unkboss'].includes(q.kind) ? 0 : (S.quests.acc[q.id]||0);
  return Math.min(q.need, qCounter(q)-base);
}
const sideActive = () => Object.keys(S.quests.acc).filter(id=>!qdef(id).main);
function checkQuests(){
  for(const id of Object.keys(S.quests.acc)){
    const q=qdef(id);
    if(!q.main && qProgress(q)>=q.need && !S.quests.ready.includes(id)){ S.quests.ready.push(id); log(`✦ 의뢰 달성: 「${q.n}」 — 길드 게시판에 보고하자.`,'gold'); }
  }
}
function acceptQuest(id){
  if(sideActive().length>=QMAX){ log(`의뢰는 한 번에 ${QMAX}개까지 받을 수 있다.`,'bad'); return render(); }
  const q=qdef(id); S.quests.acc[id]=['floor','unkfloor'].includes(q.kind)?0:qCounter(q);
  log(`의뢰 「${q.n}」를 받았다.`,'good'); checkQuests(); render();
}
function claimQuest(id){
  const q=qdef(id); delete S.quests.acc[id]; S.quests.ready=S.quests.ready.filter(x=>x!==id); S.quests.done.push(id);
  S.gold+=q.gold||0; if(q.potions) S.potions+=q.potions;
  living().forEach(m=>m.xp+=q.xp||0);
  log(`의뢰 「${q.n}」 완료! 금화 ${q.gold}G${q.xp?`, 각자 경험치 ${q.xp}`:''}${q.potions?`, 물약 ${q.potions}개`:''}를 받았다.`,'gold'); render();
}

// ───────── 미궁 ─────────
// 알 수 없는 미궁의 층: 시드로 만든 미로. 같은 시드면 같은 모양이라 저장해도 그대로다
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genFloor(seed,f){
  const N=13, r=mulberry(seed*7+f*131), g=Array.from({length:N},()=>Array(N).fill('#')), D4=[[0,-1],[1,0],[0,1],[-1,0]];
  const st=[[1,1]]; g[1][1]='.';
  while(st.length){
    const [x,y]=st[st.length-1];
    const ds=D4.map(([dx,dy])=>[dx*2,dy*2]).filter(([dx,dy])=>{ const nx=x+dx, ny=y+dy; return nx>0&&ny>0&&nx<N-1&&ny<N-1&&g[ny][nx]==='#'; });
    if(!ds.length){ st.pop(); continue; }
    const [dx,dy]=ds[Math.floor(r()*ds.length)]; g[y+dy/2][x+dx/2]='.'; g[y+dy][x+dx]='.'; st.push([x+dx,y+dy]);
  }
  // 막다른 길만 있으면 답답하니 벽 몇 군데를 터서 고리를 만든다
  for(let i=0;i<10;i++){ const x=1+Math.floor(r()*(N-2)), y=1+Math.floor(r()*(N-2));
    if(g[y][x]==='#' && ((g[y][x-1]==='.'&&g[y][x+1]==='.')||(g[y-1][x]==='.'&&g[y+1][x]==='.'))) g[y][x]='.'; }
  const dist={'1,1':0}, q=[[1,1]]; let far=[1,1];
  while(q.length){ const [x,y]=q.shift();
    for(const [dx,dy] of D4){ const nx=x+dx, ny=y+dy, k=nx+','+ny;
      if(g[ny][nx]==='.' && !(k in dist)){ dist[k]=dist[x+','+y]+1; q.push([nx,ny]); if(dist[k]>dist[far[0]+','+far[1]]) far=[nx,ny]; } } }
  g[1][1]='<'; g[far[1]][far[0]] = f===3 ? 'B' : '>';
  const dead=Object.keys(dist).map(k=>k.split(',').map(Number)).filter(([x,y])=>g[y][x]==='.' && D4.filter(([dx,dy])=>g[y+dy][x+dx]!=='#').length===1);
  // 시작점에서 어느 정도 떨어진 막다른 길에 정령의 제단, 나머지 막다른 길 두 곳에 상자
  const open=Object.keys(dist).map(k=>k.split(',').map(Number)).filter(([x,y])=>g[y][x]==='.'&&dist[x+','+y]>=4);
  const far2=dead.filter(([x,y])=>dist[x+','+y]>=5), pickS=far2.length?far2:dead.length?dead:open;
  if(pickS.length){ const [x,y]=pickS[Math.floor(r()*pickS.length)]; g[y][x]='S'; const di=dead.findIndex(([a,b])=>a===x&&b===y); if(di>=0) dead.splice(di,1); }
  for(let i=0;i<2&&dead.length;i++){ const [x,y]=dead.splice(Math.floor(r()*dead.length),1)[0]; g[y][x]='T'; }
  return g.map(row=>row.join(''));
}
const UNK_CACHE={};
function mapOf(f){ if(S.realm!=='unknown') return MAPS[f]; const k=S.unk.seed+':'+f; return UNK_CACHE[k] ||= genFloor(S.unk.seed,f); }
const bossGone = () => S.realm==='unknown' ? S.unk.bossDead : S.bossDead;
const floorText = f => S.realm==='unknown' ? UNK_TEXT[f] : FLOOR_TEXT[f];
function cell(x,y,f=S.floor){
  const row=mapOf(f)[y]; if(!row||x<0||x>=row.length) return '#';
  const ch=row[x];
  if(ch==='T' && S.opened.includes(`${f}:${x},${y}`)) return '.';
  if(ch==='B' && bossGone()) return '.';
  return ch;
}
const wall = (x,y) => cell(x,y)==='#';
function find(f,ch){ const m=mapOf(f); for(let y=0;y<m.length;y++){const x=m[y].indexOf(ch); if(x>=0) return {x,y};} }
function markExplored(){ const k=`${S.x},${S.y}`, e=S.explored[S.floor]; if(!e.includes(k)) e.push(k); }
function openDir(x,y){ for(let d=0;d<4;d++) if(!wall(x+DX[d],y+DY[d])) return d; return 0; }
function arrive(){
  if(S.realm==='unknown'){ if(S.floor>S.unkMax){ S.unkMax=S.floor; checkQuests(); } }
  else if(S.floor>S.maxFloor){ S.maxFloor=S.floor; checkQuests(); }
}

function enterDungeon(){
  if(!living().length){ log('살아있는 동료가 없다. 사원에 먼저 가자.','bad'); return render(); }
  S.spiritUsed=false;
  // 2회차부터 옛 미궁은 무너졌다. 입구는 들어갈 때마다 모양이 바뀌는 알 수 없는 미궁으로 이어진다
  if(S.cycle>=2){
    S.realm='unknown'; S.unk={seed:(Math.random()*1e9)|0, bossDead:false, prayed:{}}; S.explored={1:[],2:[],3:[]}; S.opened=[];
    log('「?」 — 알 수 없는 미궁. 들어설 때마다 길이 바뀐다.','mag');
  } else S.realm='normal';
  S.mode='dungeon'; S.floor=1; const p=find(1,'<'); S.x=p.x; S.y=p.y; S.dir=openDir(p.x,p.y);

}
function move(k){
  if(S.mode!=='dungeon') return;
  UI.shrine=null; UI.confirm=null;
  if(k==='L') S.dir=(S.dir+3)%4;
  else if(k==='R') S.dir=(S.dir+1)%4;
  else if(k==='U') S.dir=(S.dir+2)%4;
  else {
    const d = k==='B' ? (S.dir+2)%4 : S.dir, nx=S.x+DX[d], ny=S.y+DY[d];
    if(wall(nx,ny)){ log('차가운 돌벽에 부딪혔다.','bad'); shake(3,180); return render(); }
    S.x=nx; S.y=ny; markExplored();
    // 독: 한 걸음마다 HP 1 (1 아래로는 떨어지지 않는다)
    living().forEach(m=>{ if(hasBf(m,'poison') && m.hp>1) m.hp--; });
    return onEnter();
  }
  render();
}
function onEnter(){
  const ch=cell(S.x,S.y);
  if(ch==='S'){ log(S.unk?.prayed?.[S.floor]?'정령의 제단. 이 층의 빛은 이미 다 썼다.':'정령의 제단. 푸른 불꽃이 흔들린다. 정령의 목소리가 들린다. 「기도하라.」','mag'); return render(); }
  if(ch==='B' && S.realm==='unknown'){ log('끝없는 어둠. 형체 없는 무언가가 파티의 이름을 하나씩 부른다.','bad'); log('"…너희는 누구였지?"','mag'); return startCombat(true); }
  if(ch==='B'){ log('룬이 새겨진 방. 검붉은 거체가 어둠 속에서 몸을 일으킨다.','bad'); log('"서약의 검을 원하는가. 그렇다면 여기서 썩어라."','bad'); return startCombat(true); }
  if(ch==='T') log('낡은 보물상자가 놓여 있다.','gold');
  else if(ch==='<') log(S.floor===1?'위로 올라가는 계단. 마을로 돌아갈 수 있다.':'위층으로 올라가는 계단이다.','sys');
  else if(ch==='>') log('아래로 내려가는 계단. 더 깊은 어둠이 입을 벌리고 있다.','sys');
  else if(Math.random()<0.1) return startCombat(false);
  else if(Math.random()<0.08) log(pick(AMBIENT),'sys');
  render();
}
function stairs(){
  const ch=cell(S.x,S.y);
  if(ch==='<'){
    if(S.floor===1){ S.mode='town'; S.townView='main'; UI.scene='square'; UI.fadeIn=now(); log('파티는 지상으로 돌아왔다. 새벽 종소리가 울린다.','good'); return render(); }
    S.floor--; const p=find(S.floor,'>'); S.x=p.x; S.y=p.y;
  } else if(ch==='>'){ S.floor++; const p=find(S.floor,'<'); S.x=p.x; S.y=p.y; }
  S.dir=openDir(S.x,S.y); markExplored(); arrive(); log(floorText(S.floor),'sys'); render();
}
function openChest(){
  S.opened.push(`${S.floor}:${S.x},${S.y}`); S.chests++;
  const thief=S.party.find(m=>m.cls==='도적'&&!m.dead);
  if(thief) log(`${J(thief.name,'이','가')} 상자의 독침 함정을 해제했다.`,'good');
  else if(Math.random()<0.5 - Math.max(...living().map(m=>m.st.luk))*0.015){
    log('찰칵! 독침 함정이 튀어나왔다!','bad'); shake(5,300);
    living().forEach(m=>{ const d=rnd(2,5)*S.floor; m.hp=Math.max(1,m.hp-d); addBf(m,'poison',99); pfx(m,'hit',`-${d}`); log(`${J(m.name,'은','는')} ${d}의 피해를 입고 중독되었다.`,'bad'); });
  }
  const g=rnd(30,80)*S.floor; S.gold+=g; log(`금화 ${g}G를 얻었다.`,'gold');
  if(Math.random()<0.6){ S.potions++; log('치유 물약을 하나 발견했다.','gold'); }
  checkQuests(); render();
}
function pray(){
  const f=S.floor, cap=SHRINE_REVIVE[f]||1;
  if(!S.unk || S.unk.prayed[f]) return render();
  S.unk.prayed[f]=true;
  const dead=S.party.filter(m=>m.dead), back=dead.slice(0,cap);
  back.forEach(m=>{ m.dead=false; m.hp=Math.ceil(m.mhp/2); m.mp=0; m.bf=[]; pfx(m,'heal','부활'); });
  living().filter(m=>!back.includes(m)).forEach(m=>{ m.hp=m.mhp; m.mp=m.mmp; m.bf=[]; pfx(m,'heal','회복'); });
  fx('spirit',W/2,H/2,{dur:1200});

  if(dead.length>back.length) log(`  이 층의 제단으로는 ${cap}명까지만 되살릴 수 있다. ${dead.length-back.length}명은 아직 잠들어 있다.`,'bad');
  log('  살아 있던 동료들의 HP와 MP가 모두 회복되고 독과 저주가 풀렸다.','good');
  render();
}
function shrineLevel(){
  let any=false; living().forEach(m=>{ if(levelUp(m)) any=true; });
  if(any) log('정령이 쌓인 경험을 힘으로 바꾸었다.','mag'); else log('아직 레벨이 오를 동료가 없다.','sys');

function useSpirit(){
  if(!S.spirit || S.spiritUsed || S.mode!=='dungeon') return;
  const p=find(S.floor,'<'); S.spiritUsed=true; S.x=p.x; S.y=p.y; S.dir=openDir(p.x,p.y); markExplored();
  fx('spirit',W/2,H/2,{dur:1100}); UI.fadeIn=now();
  log('✧ 정령이 푸른 빛으로 파티를 감싼다. 눈을 뜨니 이 층의 입구다.','mag');
  log('(정령은 힘을 다해 잠들었다. 다음에 미궁에 들어올 때 다시 깨어난다.)','sys'); render();
}
function wounded(){ return living().filter(m=>m.hp<m.mhp||hasBf(m,'poison')).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0]; }
function drinkPotion(t){ S.potions--; const h=Math.min(15,t.mhp-t.hp); t.hp+=h; const cured=hasBf(t,'poison'); delBf(t,'poison'); pfx(t,'heal',`+${h}`); return `HP +${h}${cured?', 해독':''}`; }
function fieldHeal(kind){
  const t=wounded(); if(!t){ log('다친 동료가 없다.','sys'); return render(); }
  if(kind==='potion') log(`${J(t.name,'이','가')} 물약을 마셨다. ${drinkPotion(t)}`,'good');
  else {
    const p=S.party.find(m=>m.cls==='승려'&&!m.dead&&m.mp>=1); p.mp--;
    const h=Math.min(rnd(4,10)+spw(p),t.mhp-t.hp); t.hp+=h; pfx(t,'heal',`+${h}`); log(`${J(p.name,'이','가')} 사나(치유)를 외웠다. ${t.name} HP +${h}`,'mag');
  }
  render();
}

// ───────── 마을 ─────────
function inn(kind){
  const al=living();
  if(kind==='room'){
    const cost=al.length*10;
    if(S.gold<cost){ log('금화가 부족하다.','bad'); return render(); }
    S.gold-=cost; al.forEach(m=>{m.hp=m.mhp;m.mp=m.mmp;m.bf=[];});
    log(`객실에서 푹 쉬었다. (−${cost}G) HP와 MP가 모두 회복되고 독과 저주가 풀렸다.`,'good');
  } else return;
  let any=false; al.forEach(m=>{ if(levelUp(m)) any=true; });
  if(!any) log('레벨이 오른 동료는 없다.','sys');
  render();
}
function levelUp(m){
  const c=CLS[m.cls]; let up=false;
  while(m.xp>=need(m.lv)){
    m.lv++; up=true; const h=Math.max(1,rnd(...c.hpL)+mod(m.st.vit)); m.mhp+=h; m.hp+=h; m.mmp+=c.mpL; m.mp+=c.mpL;
    log(`★ ${m.name} 레벨 ${m.lv}! 최대 HP +${h}${c.mpL?`, 최대 MP +${c.mpL}`:''}`,'gold');
    c.spells.filter(k=>SPELLS[k].lv===m.lv).forEach(k=>log(`  ${J(m.name,'은','는')} 새 주문 「${k}(${SPELLS[k].ko})」를 깨우쳤다.`,'mag'));
  }
  return up;
}
function buy(v){
  const [id,who]=v.split(':'), it=SHOP.find(i=>i.id===id);
  if(S.gold<it.p){ log('금화가 부족하다.','bad'); return render(); }
  S.gold-=it.p;
  if(id==='potion'){ S.potions++; log(`치유 물약을 샀다. (보유 ${S.potions})`,'good'); }
  else { const m=S.party[+who]; m.gear.push(id); m.atkB+=it.atk||0; m.defB+=it.def||0; m.magB+=it.mag||0; log(`${J(m.name,'이','가')} ${J(it.n,'을','를')} 장비했다.`,'good'); }
  render();
}
function sell(v){
  if(v==='potion'){ if(S.potions<=0) return render(); S.potions--; S.gold+=12; log('치유 물약 1개를 12G에 팔았다.','gold'); return render(); }
  const [id,who]=v.split(':'), m=S.party[+who], it=SHOP.find(i=>i.id===id);
  if(!m || !m.gear.includes(id)) return render();

// ───────── 전투 ─────────
function spawn(b){
  const e={id:b.id,n:b.n,name:b.n,ic:b.ic,hp:rnd(...b.hp),atk:b.atk,def:b.def,xp:b.xp,g:rnd(...b.g),ag:b.ag,
    on:b.on,cast:b.cast,undead:b.undead,boss:b.boss,big:b.big,sleep:0,bf:[],ph:Math.random()*4};
  // 알 수 없는 미궁의 마물은 이계의 힘으로 강해진다 (보스는 원래 수치 그대로)
  if(S.realm==='unknown' && b!==UNKNOWN_BOSS){
    e.unk=1; e.n=e.name='이계의 '+b.n; e.hp=Math.round(e.hp*UNK.hp); e.atk=b.atk.map(v=>Math.round(v*UNK.atk));
    e.xp=Math.round(b.xp*UNK.xp); e.g=Math.round(e.g*UNK.gold); if(b.cast) e.cast={...b.cast,dmg:b.cast.dmg.map(v=>Math.round(v*UNK.atk))};
  }
  if(b===UNKNOWN_BOSS) e.unk=1;
  return e;
}
function startCombat(boss){
  let list=[];
  if(boss) list = S.realm==='unknown' ? [spawn(MON[3][3]),spawn(UNKNOWN_BOSS),spawn(MON[3][3])] : [spawn(NECRO),spawn(BOSS),spawn(NECRO)];
  else {
    // 알 수 없는 미궁은 한 층 더 깊은 곳의 마물이 나온다
    const pool=MON[S.realm==='unknown'?Math.min(3,S.floor+1):S.floor];
    const b=pick(pool), n=rnd(S.floor===1&&S.realm!=='unknown'?1:2,Math.min(4,S.floor+2));
    for(let i=0;i<n;i++) list.push(spawn(b));
    if(Math.random()<0.3) list.push(spawn(pick(pool)));
  }
  const cnt={}; list.forEach(e=>cnt[e.n]=(cnt[e.n]||0)+1);
  const seen={}; list.forEach(e=>{ if(cnt[e.n]>1){ seen[e.n]=(seen[e.n]||0); e.name=`${e.n} ${TAGS[seen[e.n]++]}`; } });
  const desc=Object.entries(cnt).map(([n,c])=>c>1?`${n} ${c}마리`:n).join(', ');
  S.mode='combat'; S.combat={enemies:list,cmds:[],cur:-1,sub:null,pend:null,flee:false,boss:!!boss,t0:now()};
  log(`⚔ ${J(desc,'이','가')} 나타났다!`,'bad');
  fx('flash',0,0,{color:'163,36,29',dur:400});
  nextActor();
}
function nextActor(){
  const c=S.combat; let i=c.cur+1;
  while(i<S.party.length && S.party[i].dead) i++;
  if(i>=S.party.length) return resolveRound();
  c.cur=i; c.sub=null; c.pend=null; render();
}
function pushCmd(cmd){ const c=S.combat; cmd.who=c.cur; c.cmds.push(cmd); nextActor(); }
function combatCmd(a,v){
  const c=S.combat;
  if(a==='atk'){ if(liveEnemies().length>1){ c.pend={act:'atk'}; c.sub='enemy'; render(); } else pushCmd({act:'atk',target:c.enemies.indexOf(liveEnemies()[0])}); }
  else if(a==='magic'){ c.sub='spell'; render(); }
  else if(a==='sp'){
    const sp=SPELLS[v]; c.pend={act:'spell',spell:v};
    if(sp.tgt==='enemy'){ if(liveEnemies().length>1){ c.sub='enemy'; render(); } else pushCmd({...c.pend,target:c.enemies.indexOf(liveEnemies()[0])}); }
    else if(sp.tgt==='ally'){ c.sub='ally'; render(); }
    else pushCmd(c.pend);
  }
  else if(a==='guard') pushCmd({act:'guard'});
  else if(a==='potion'){ c.pend={act:'potion'}; c.sub='ally'; render(); }
  else if(a==='tgt') pushCmd({...c.pend,target:+v});
  else if(a==='flee'){ c.cmds=[]; c.flee=true; resolveRound(); }
  else if(a==='back'){
    if(c.sub){ c.sub=null; c.pend=null; }
    else if(c.cmds.length){ const last=c.cmds.pop(); c.cur=last.who; }
    render();
  }
}
async function resolveRound(){
  busy=true; const c=S.combat; render();
  if(c.flee){
    c.flee=false;
    if(!c.boss && Math.random()<0.55){ log('파티는 무사히 도망쳤다!','sys'); busy=false; endCombat(); S.mode='dungeon'; return render(); }
    log(c.boss?'보이지 않는 결계가 길을 막고 있다!':'도망치지 못했다!','bad'); render(); await sleep(400);
  }
  S.party.forEach(m=>m.guard=false);
  c.cmds.forEach(cm=>{ if(cm.act==='guard') S.party[cm.who].guard=true; });
  const order=[];
  c.cmds.forEach(cm=>order.push({p:1,cm,init:S.party[cm.who].ag+bsum(S.party[cm.who],'ag')+rnd(0,8)}));
  c.enemies.forEach(e=>{ if(e.hp>0) order.push({p:0,e,init:e.ag+rnd(0,8)}); });
  order.sort((a,b)=>b.init-a.init);
  for(const o of order){
    if(!liveEnemies().length || !living().length) break;
    const did = o.p ? partyAct(o.cm) : enemyAct(o.e);
    if(did){ render(); await sleep(560); }
  }
  // 라운드 끝: 독 피해와 버프 시간 감소
  if(liveEnemies().length && living().length){
    const ticked = [...living(), ...liveEnemies()].map(tick).some(Boolean);
    if(ticked){ render(); await sleep(400); }
  }
  busy=false;
  if(!liveEnemies().length){ await sleep(300); return victory(); }
  if(!living().length){ S.mode='dead'; endCombat(); log('파티는 미궁에서 전멸했다. 아무도 그들을 찾으러 오지 않았다.','bad'); render(); return refreshSlots(); }
  S.party.forEach(m=>m.guard=false);
  c.cmds=[]; c.cur=-1; log('— 다음 라운드 —','round'); nextActor();
}
function tick(x){
  let any=false; const isP=S.party.includes(x);
  for(const b of [...(x.bf||[])]){
    if(b.k==='poison'){ const d=rnd(...BUFF.poison.dot), before=x.hp; x.hp=Math.max(1,x.hp-d);
      if(x.hp<before){ any=true; log(`${J(x.name,'은','는')} 독으로 ${before-x.hp}의 피해를 입었다.`,'bad'); isP?pfx(x,'hit',`-${before-x.hp}`):efx(x,'num',{text:`-${before-x.hp}`,color:'#9cc25a'}); } }
    if(b.t<90 && --b.t<=0){ delBf(x,b.k); any=true; log(`${x.name}의 ${BUFF[b.k].n} 효과가 사라졌다.`,'sys'); }
  }
  return any;
}
function endCombat(){ S.party.forEach(m=>{ m.guard=false; m.bf=(m.bf||[]).filter(b=>b.k==='poison'); }); S.combat=null; FX.length=0; }

}

    if(Math.random()<(m.cls==='도적'?0.12:0)+(m.crit||0)+Math.max(0,m.st.luk-8)*0.01){ d*=2; log(`${J(m.name,'이','가')} 급소를 찔렀다!`,'gold'); efx(e,'slash',{dur:450,big:1}); fx('flash',0,0,{color:'255,240,210',dur:220}); shake(5,220); }

function enemyAct(e){

function victory(){

function drawView(t){
  const g=ctx; g.save();
  if(t<shakeEnd){ const a=shakeAmp*(shakeEnd-t)/300; g.translate((Math.random()-0.5)*a*2,(Math.random()-0.5)*a*2); }
  let gr=g.createLinearGradient(0,0,0,H/2); gr.addColorStop(0,'#030202'); gr.addColorStop(1,'#0c0909'); g.fillStyle=gr; g.fillRect(-10,-10,W+20,H/2+10);
  gr=g.createLinearGradient(0,H/2,0,H); gr.addColorStop(0,'#0c0909'); gr.addColorStop(1,'#2a1f1a'); g.fillStyle=gr; g.fillRect(-10,H/2,W+20,H/2+10);
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=1; g.beginPath();
  for(let d=1;d<6;d++){ const r=R(d); g.moveTo(0,r.b); g.lineTo(W,r.b); }
  for(let i=-3;i<=3;i++){ g.moveTo(W/2+i*150,H); g.lineTo(W/2+i*8,H/2+8); }
  g.stroke();
  const fx_=DX[S.dir],fy=DY[S.dir],lx=DX[(S.dir+3)%4],ly=DY[(S.dir+3)%4];
  for(let d=0;d<5;d++){
    const cx=S.x+fx_*d, cy=S.y+fy*d, a=R(d), b=R(d+1), sh=1-d*0.19;
    if(wall(cx+lx,cy+ly)) stone([[a.l,a.t],[b.l,b.t],[b.l,b.b],[a.l,a.b]],sh,2);
    else if(wall(cx+lx+fx_,cy+ly+fy)) stone([[a.l,b.t],[b.l,b.t],[b.l,b.b],[a.l,b.b]],sh*0.85,1);
    if(wall(cx-lx,cy-ly)) stone([[a.r,a.t],[b.r,b.t],[b.r,b.b],[a.r,a.b]],sh,2);
    else if(wall(cx-lx+fx_,cy-ly+fy)) stone([[b.r,b.t],[a.r,b.t],[a.r,b.b],[b.r,b.b]],sh*0.85,1);
    if(d>=1) marker(cell(cx,cy),a,b,d,t);
    if(wall(cx+fx_,cy+fy)){ stone([[b.l,b.t],[b.r,b.t],[b.r,b.b],[b.l,b.b]],sh,4); break; }
  }

  gr=g.createRadialGradient(W/2,H/2,W*0.22,W/2,H/2,W*0.72); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.72)'); g.fillStyle=gr; g.fillRect(-10,-10,W+20,H+20);

function drawEnemies(t){
  const g=ctx; g.fillStyle='rgba(5,3,4,.5)'; g.fillRect(-10,-10,W+20,H+20);
  const L=layout(t), slotW=W/(L.length+1)-6;  // 이름표가 옆 몬스터와 겹치지 않게 칸 폭 안에 맞춘다
  for(const {e,x,yb,th} of L){
    const dying = e.hp<=0, dp = dying ? Math.min(1,(t-e.diedAt)/800) : 0;
    const hitP = e.hitAt ? (t-e.hitAt)/300 : 1, atkP = e.atkAt ? (t-e.atkAt)/350 : 1;
    let ox=0, oy=reduce?0:Math.sin(t/420+e.ph)*2, sc=1;
    if(hitP<1 && !reduce) ox=Math.sin(hitP*Math.PI*6)*5*(1-hitP);
    if(atkP<1){ const k=Math.sin(atkP*Math.PI); sc=1+0.18*k; oy+=10*k; }
    const ent = Math.min(1,(t-(S.combat.t0||0))/400);           // 등장: 아래에서 떠오른다
    oy += (1-ent)*30;
    g.save(); g.globalAlpha=(e.sleep?0.6:1)*(1-dp)*ent;
    // 그림자
    g.fillStyle='rgba(0,0,0,.55)'; g.beginPath(); g.ellipse(x,yb+2,th*0.32,th*0.07,0,0,7); g.fill();
    g.shadowColor=e.unk?'rgba(150,90,235,.9)':e.boss?'rgba(220,40,30,.9)':hasBf(e,'weak')?'rgba(125,79,196,.9)':'rgba(163,36,29,.6)'; g.shadowBlur=e.boss?26:14;
    const flash = hitP<1 ? 1-hitP : 0;
    const drawn = drawSprite(g,'monsters/'+e.id,x+ox,yb+oy+dp*20,th*sc,t,{phase:e.ph,flash});
    if(!drawn) drawIcon(g,e.ic,x+ox,yb+oy-th*sc/2,th*sc,flash?'#ffffff':'#efe2c4','#5e3a2c');
    g.restore();
    if(dying) continue;
    g.save(); g.textAlign='center'; g.font='13px "Gowun Batang",serif'; g.lineWidth=3; g.strokeStyle='rgba(0,0,0,.85)';
    if(L.length>=4) g.font='12px "Gowun Batang",serif';
    const label=(L.length>=4?e.name.replace('이계의 ',''):e.name)+(e.sleep?' · 잠':''); g.strokeText(label,x,yb+18,slotW); g.fillStyle=css('--line'); g.fillText(label,x,yb+18,slotW);
    const tags=(e.bf||[]).map(b=>BUFF[b.k].n).join(' ');
    if(tags){ g.font='12px "Gowun Batang",serif'; g.strokeText(tags,x,yb+33,slotW); g.fillStyle=css('--mag'); g.fillText(tags,x,yb+33,slotW); }
    g.restore();
  }
}
// 디아블로식 반투명 지도: 미궁 화면 위에 겹쳐 그린다. 파티가 늘 가운데
function drawAutomap(){
  const g=ctx, f=S.floor, rows=mapOf(f), n=rows.length, sz=Math.floor(Math.min((W-24)/rows[0].length,(H-44)/n));

  g.save();
  g.fillStyle='rgba(5,3,4,.45)'; g.fillRect(-10,-10,W+20,H+20);
  g.strokeStyle='rgba(217,202,169,.22)'; g.lineWidth=1; g.strokeRect(ox-0.5,oy-0.5,rows[0].length*sz+1,n*sz+1);
  g.lineWidth=2.2; g.strokeStyle='rgba(235,205,150,.95)'; g.shadowColor='rgba(235,205,150,.7)'; g.shadowBlur=6;
  for(const k of ex){

    g.fillStyle='rgba(217,202,169,.13)'; g.fillRect(px,py,sz,sz);
    g.beginPath();

      ${dead.map(([m,i])=>mRow(m.name,`${m.race} ${m.cls} Lv${m.lv} · HP 1로 되살아난다`,`${60*m.lv}G`,B('되살린다','rez',i,{dis:S.gold<60*m.lv,primary:1}))).join('')||'<p class="hint" style="padding:8px 0">쓰러진 동료가 없다.</p>'}
      <div class="msec">정화</div>
      ${sick.map(([m,i])=>mRow(m.name,m.bf.map(b=>BUFF[b.k].n).join(', ')+' 해제','15G',B('정화한다','cure',i,{dis:S.gold<15}))).join('')||'<p class="hint" style="padding:8px 0">독이나 저주에 걸린 동료가 없다.</p>'}
    </div>`;
  }
  if(v==='quit') return mHead('lorc_candle-skull','타이틀로','여관에서 기록하지 않은 진행은 사라진다.')+`<div class="mbody"><p style="padding-top:12px">정말 타이틀 화면으로 돌아갈까?</p><div class="btns">${B('예, 타이틀로','title','',{primary:1})}${B('아니오','close')}</div></div>`;
  return '';
}

    <div class="fld"><button class="btn wide primary" id="regbtn" data-a="register" data-v=""${prob?' disabled':''}>등록부에 올린다</button>

function bfChips(m){
  if(!m.bf?.length) return '';
  return `<div class="bfs">${m.bf.map(b=>`<span class="bf ${b.k==='poison'?'poison':BUFF[b.k].good?'good':'bad'}">${BUFF[b.k].n}${b.t<90?` ${b.t}`:''}</span>`).join('')}</div>`;
}
function partyHTML(){
  if(!S.party.length) return `<p class="muted">${S.mode==='create'?'빈 등록부. 왼쪽에서 첫 모험가를 만들어 보자.':'아직 파티가 없다.'}</p>`;
  const row=i=>i===0?'<div class="rowlbl">전열</div>':i===2?'<div class="rowlbl">후열</div>':'';
  if(S.mode==='create') return S.party.map((m,i)=>`${row(i)}
      <div class="pm">${portrait(m)}<span class="nm">${m.name} <span>${m.race} ${m.cls}</span></span>
        <span class="adj"><button class="mini" data-a="up" data-v="${i}" aria-label="${m.name} 앞으로"${i?'':' disabled'}>▲</button><button class="mini" data-a="kick" data-v="${i}" aria-label="${m.name} 지우기">✕</button></span>
        <div class="row"><div>HP ${m.mhp}${m.mmp?` · MP ${m.mmp}`:''}</div><div class="stline">${STATS.map(([k,n])=>`${n[0]}${m.st[k]}`).join(' ')}</div></div></div>`).join('');
  const cur=S.mode==='combat'&&!busy&&S.combat?S.combat.cur:-1, t=now();
  return S.party.map((m,i)=>{
    const hpP=Math.max(0,m.hp/m.mhp*100), mpP=m.mmp?m.mp/m.mmp*100:0, ready=m.xp>=need(m.lv);
    const p=PFX[i], live=p && t-p.t<900, el=live?Math.round(t-p.t):0;
    return `${row(i)}<div class="pm${i===cur?' cur':''}${m.dead?' dead':''}${live?` fx-${p.k}`:''}"${live?` style="animation-delay:-${el}ms"`:''}>${portrait(m)}
      <span class="nm">${i===cur?'▶ ':''}${m.name} <span>${m.race} ${m.cls} Lv${m.lv}</span></span>
      <span class="tag">${m.dead?'사망':m.guard?'방어':ready?'Lv↑ 가능':`다음 ${need(m.lv)-m.xp}`}</span>
      <div class="row"><div>HP ${m.hp}/${m.mhp}<div class="bar${hpP<30?' low':''}"><i style="width:${hpP}%"></i></div></div>
      <div>${m.mmp?`MP ${m.mp}/${m.mmp}<div class="bar mp"><i style="width:${mpP}%"></i></div>`:'<span class="muted">—</span>'}</div></div>
      ${m.gear.some(id=>id.startsWith('u_'))?`<div class="bfs">${m.gear.filter(id=>id.startsWith('u_')).map(id=>`<span class="bf good">★ ${uniqueById(id).n}</span>`).join('')}</div>`:''}
      ${bfChips(m)}${live?`<span class="ftxt ${p.k}" style="animation-delay:-${el}ms">${p.txt}</span>`:''}
    </div>`;}).join('');
}
function trackerHTML(){
  if(!['town','dungeon','combat'].includes(S.mode)) return '';
  const ids=Object.keys(S.quests.acc); if(!ids.length) return '';
  return `<div class="qlist"><div class="rowlbl">의뢰</div>${ids.map(id=>{ const q=qdef(id), pr=qProgress(q), ok=pr>=q.need;
    return `<div class="q${ok?' ok':''}"><span>${q.n}</span><b>${q.main?(ok?'완료':'진행 중'):ok?'보고 가능':`${pr}/${q.need}`}</b></div>`; }).join('')}</div>`;
}
function render(){
  const inView = animated();
  const here = S.mode==='town' && UI.scene==='facade' && TOWN[UI.fac];
  const where = S.mode==='town' ? (here ? tname(UI.fac) : ruined()?'리르가드 폐허':'리르가드 광장')
    : ({create:'모험가 길드',ending:'—',dead:'미궁 속'}[S.mode] || `${S.realm==='unknown'?'알 수 없는 미궁':'지하'} ${S.floor}층 · ${DIRS[S.dir]}쪽`);
  const tag = [S.cycle>=2?'2회차':'', S.rebirths?`환생 ${S.rebirths}`:''].filter(Boolean).map(x=>`<span><b class="g">${x}</b></span>`).join('');
  $('#hud').innerHTML = S.mode==='title' ? '' : `${tag}<span>장소 <b>${where}</b></span><span>금화 <b class="g">${S.gold}G</b></span><span>물약 <b>${S.potions}</b></span>`;
  view.hidden=!inView; $('#place').hidden=inView; $('#loc').hidden=!inView;
  $('#viewcap').textContent = {title:'서장',create:'등록소',town:'마을',ending:'종장',dead:'종막',combat:'전투'}[S.mode] || '시야';
  if(inView){ drawFrame(now()); kick(); } else $('#place').innerHTML=placeHTML();
  const ch=S.mode==='dungeon'?cell(S.x,S.y):'';
  $('#loc').textContent = S.mode==='ending' ? '' : S.mode==='town' ? (here ? `${tname(UI.fac)} 앞. ${tdesc(UI.fac)}` : ruined() ? '잿더미가 된 리르가드. 간판도 불빛도 남지 않았다. 오른쪽 무너진 입구 자리에 보랏빛 「?」 균열만 열려 있다.' : '리르가드 광장. 왼쪽에 여관과 길드, 오른쪽에 상점과 지하묘지 입구, 길 끝에 사원이 보인다.')
    : S.mode==='combat' ? '적과 마주쳤다.'
    : ch==='T'?'발밑에 보물상자가 있다.':ch==='<'?'올라가는 계단 위에 서 있다.':ch==='>'?'내려가는 계단 앞에 서 있다.':`좌표 ${S.x}·${S.y}`;
  $('#party').innerHTML=partyHTML();
  $('#qtrack').innerHTML=trackerHTML();
  $('#cmd').innerHTML=cmdHTML();
  // 시설 창
  const md=$('#modal'), open=modalOpen();
  if(open){
    const wasOpen=!md.hidden, sc=md.querySelector('.mbody')?.scrollTop||0;
    md.innerHTML=`<div class="mback"></div><div class="mwin win${wasOpen?'':' enter'}" role="dialog" aria-modal="true" aria-labelledby="mtitle" tabindex="-1">${modalHTML()}</div>`;
    md.hidden=false;
    const body=md.querySelector('.mbody'); if(body) body.scrollTop=sc;
    if(!wasOpen) md.querySelector('.mwin').focus();
  } else { md.hidden=true; md.innerHTML=''; }
  document.documentElement.style.overflow = open ? 'hidden' : '';
  // 숫자키 번호는 화면에 보이는 순서대로 매긴다. 누르는 키와 표시가 항상 같다.
  [...document.querySelectorAll(open?'#modal .mbody button.btn[data-a]:not(:disabled)':'#cmd button[data-a]:not(:disabled)')].slice(0,9).forEach((b,i)=>b.insertAdjacentHTML('afterbegin',`<kbd>${i+1}</kbd>`));
  const lines=S.log.map(l=>`<div class="l ${l.k}">${l.t}</div>`);
  const lg=$('#log'); lg.innerHTML=lines.join(''); lg.scrollTop=lg.scrollHeight;
  $('#recent').innerHTML=lines.slice(-3).join('');
}

// ───────── 입력 ─────────
function dispatch(a,v){
  if(busy) return;
  if(a==='title') return toTitle();
  if(a==='new') return newGame();
  if(a==='next') return endingNext();
  if(a==='load') return loadFrom(+v);
  if(a==='save') return saveTo(+v);
  if(a==='cancel'){ UI.confirm=null; return render(); }
  if(S.mode==='create') return createAct(a,v);
  if(a==='mv') return move(v);
  if(a==='go') return goTo(v);
  if(a==='close') return closeModal();
  if(a==='quit'){ S.townView='quit'; UI.confirm=null; return render(); }
  if(a==='tab'){ UI.shopTab=v; return render(); }
  if(a==='sell') return sell(v);
  if(a==='cure') return cure(+v);
  if(a==='map') return toggleMap();
  if(a==='spirit') return useSpirit();
  if(a==='shrine'){ UI.shrine='main'; UI.slots=null; refreshSlots(); return render(); }
  if(a==='pray') return pray();
  if(a==='shrinelv') return shrineLevel();
  if(a==='shrinesave'){ UI.shrine='save'; return render(); }
  if(a==='shrineback'){ UI.shrine='main'; UI.confirm=null; return render(); }
  if(a==='shrineleave'){ UI.shrine=null; UI.confirm=null; return render(); }
  if(a==='accept') return acceptQuest(v);
  if(a==='claim') return claimQuest(v);
  if(a==='enter') return enterDungeon();
  if(a==='inn') return inn(v);
  if(a==='buy') return buy(v);
  if(a==='rez') return rez(+v);
  if(a==='stairs') return stairs();
  if(a==='chest') return openChest();
  if(a==='heal') return fieldHeal(v);
  if(S.mode==='combat') return combatCmd(a,v);
}
document.addEventListener('click',e=>{
  if(e.target.classList.contains('mback')) return dispatch('close','');
  const b=e.target.closest('button[data-a]'); if(b&&!b.disabled) dispatch(b.dataset.a,b.dataset.v);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='cname'||!S.draft) return;
  S.draft.name=e.target.value; const p=draftProblem();
  $('#regbtn').disabled=!!p; $('#regwhy').textContent=p;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='cname'){ e.preventDefault(); return dispatch('register',''); }
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest('input')) return;
  const k=e.key.toLowerCase();
  const mv={w:'F',arrowup:'F',s:'B',arrowdown:'B',x:'B',a:'L',arrowleft:'L',d:'R',arrowright:'R',q:'U'}[k];
  if(mv && S.mode==='dungeon'){ e.preventDefault(); return dispatch('mv',mv); }
  if(k==='m' && S.mode==='dungeon'){ e.preventDefault(); return dispatch('map',''); }
  if(/^[1-9]$/.test(k)){ const b=[...document.querySelectorAll(modalOpen()?'#modal .mbody button.btn[data-a]:not(:disabled)':'#cmd button[data-a]:not(:disabled)')][+k-1]; if(b){ e.preventDefault(); b.click(); } }
  if(k==='escape' && modalOpen()) return dispatch('close','');
  if(k==='escape' && S.mode==='combat') dispatch('back','');
});
// 터치: 시야를 탭하면 이동 (왼쪽 1/3 좌회전, 가운데 전진, 오른쪽 1/3 우회전), 아래로 쓸면 뒤돌기
let tStart=null;
view.addEventListener('pointerdown',e=>{ tStart={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!tStart||S.mode!=='dungeon') return;
  const dx=e.clientX-tStart.x, dy=e.clientY-tStart.y; tStart=null;
  if(dy>40 && Math.abs(dy)>Math.abs(dx)) return dispatch('mv','U');
  if(Math.abs(dx)>40) return dispatch('mv', dx<0?'R':'L');
  const r=view.getBoundingClientRect(), f=(e.clientX-r.left)/r.width;
  dispatch('mv', f<1/3?'L':f>2/3?'R':'F');
});

// ───────── 시작 ─────────
window.claude?.hot?.snapshot?.(()=>({S}));
function start(data){
  data = data ?? window.claude?.hot?.data ?? {};
  if(data.S){
    S=data.S; normalize();
    if(S.mode==='town' && TOWN[S.townView]){ UI.scene='facade'; UI.fac=S.townView; }
    if(S.mode==='combat' && S.combat){ S.combat.cmds=[]; S.combat.cur=-1; S.combat.sub=null; busy=false; nextActor(); }
    else render();
    if(['title','dead'].includes(S.mode)||S.townView==='inn') refreshSlots();
  } else toTitle();
  Store.init().then(()=>{ if(Store.kind==='cloud' && (S.mode==='title'||S.mode==='dead'||S.townView==='inn')){ UI.slots=null; render(); refreshSlots(); } });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
document.fonts?.ready?.then(()=>{ if(S) render(); });
</script>
